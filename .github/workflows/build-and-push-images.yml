name: Build and push images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1" # weekly Monday at 04:17 UTC
  workflow_dispatch:
    inputs:
      mfem_ref:
        description: "MFEM git ref (branch or tag) to build"
        required: true
        default: "master"
      image_tag:
        description: "Image tag to publish (e.g. v4.9)"
        required: true
        default: "latest"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME_PREFIX: ${{ github.repository }}
  MFEM_REF: ${{ github.event.inputs.mfem_ref || 'master' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  build-images:
    name: build images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: build base image
        run: >-
          docker compose build --builder "${{ steps.buildx.outputs.name }}"
          --cache-from "type=gha,scope=base"
          --cache-to "type=gha,mode=max,scope=base" base

      - name: build cpu images
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cpu" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=cpu" cpu
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cpu-tpls" \
            --cache-from "type=gha,scope=cpu" \
            --cache-to "type=gha,mode=max,scope=cpu-tpls" cpu-tpls
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=developer-cpu" \
            --cache-from "type=gha,scope=cpu-tpls" \
            --cache-to "type=gha,mode=max,scope=developer-cpu" \
            --build-arg base_image=cpu-tpls developer-cpu

      - name: build cuda images
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cuda-sm89" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=cuda-sm89" \
            --build-arg cuda_arch_sm=89 cuda
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=developer-cuda-sm89" \
            --cache-from "type=gha,scope=cuda-sm89" \
            --cache-to "type=gha,mode=max,scope=developer-cuda-sm89" developer-cuda
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cuda-sm75" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=cuda-sm75" \
            --build-arg cuda_arch_sm=75 cuda
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=developer-cuda-sm75" \
            --cache-from "type=gha,scope=cuda-sm75" \
            --cache-to "type=gha,mode=max,scope=developer-cuda-sm75" \
            --build-arg cuda_arch_sm=75 developer-cuda

  build-and-push-base:
    name: build and push base image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build base image
        run: >-
          docker compose build --builder "${{ steps.buildx.outputs.name }}"
          --cache-from "type=gha,scope=base"
          --cache-to "type=gha,mode=max,scope=base" base

      - name: push base image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/base:latest

  build-and-push-cpu:
    name: build and push cpu images
    needs: build-and-push-base
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build cpu image
        run: >-
          docker compose build --builder "${{ steps.buildx.outputs.name }}"
          --cache-from "type=gha,scope=cpu" --cache-from "type=gha,scope=base"
          --cache-to "type=gha,mode=max,scope=cpu" cpu

      - name: push cpu image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu:$IMAGE_TAG"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu:$IMAGE_TAG"

      - name: build cpu-tpls image
        run: >-
          docker compose build --builder "${{ steps.buildx.outputs.name }}"
          --cache-from "type=gha,scope=cpu-tpls" --cache-from "type=gha,scope=cpu"
          --cache-to "type=gha,mode=max,scope=cpu-tpls" cpu-tpls

      - name: push cpu-tpls image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu-tpls:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu-tpls:$IMAGE_TAG"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cpu-tpls:$IMAGE_TAG"

      - name: build developer-cpu image
        run: >-
          docker compose build --builder "${{ steps.buildx.outputs.name }}"
          --cache-from "type=gha,scope=developer-cpu" --cache-from "type=gha,scope=cpu-tpls"
          --cache-to "type=gha,mode=max,scope=developer-cpu"
          --build-arg base_image=cpu-tpls developer-cpu

      - name: push developer-cpu image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cpu:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cpu:$IMAGE_TAG"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cpu:$IMAGE_TAG"

  build-and-push-cuda-sm89:
    name: build and push cuda-sm89 images
    needs: build-and-push-base
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build cuda-sm89 image
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cuda-sm89" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=cuda-sm89" \
            --build-arg cuda_arch_sm=89 cuda
          docker image tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda-sm89:$IMAGE_TAG"

      - name: push cuda-sm89 image
        run: docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda-sm89:$IMAGE_TAG"

      - name: build developer-cuda-sm89 image
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=developer-cuda-sm89" \
            --cache-from "type=gha,scope=cuda-sm89" \
            --cache-to "type=gha,mode=max,scope=developer-cuda-sm89" developer-cuda
          docker image tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda-sm89:$IMAGE_TAG"

      - name: push developer-cuda-sm89 image
        run: docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda-sm89:$IMAGE_TAG"

  build-and-push-cuda-sm75:
    name: build and push cuda-sm75 images
    needs: build-and-push-base
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build cuda-sm75 image
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=cuda-sm75" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=cuda-sm75" \
            --build-arg cuda_arch_sm=75 cuda
          docker image tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda-sm75:$IMAGE_TAG"

      - name: push cuda-sm75 image
        run: docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/cuda-sm75:$IMAGE_TAG"

      - name: build developer-cuda-sm75 image
        run: |
          docker compose build --builder "${{ steps.buildx.outputs.name }}" \
            --cache-from "type=gha,scope=developer-cuda-sm75" \
            --cache-from "type=gha,scope=cuda-sm75" \
            --cache-to "type=gha,mode=max,scope=developer-cuda-sm75" \
            --build-arg cuda_arch_sm=75 developer-cuda
          docker image tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda-sm75:$IMAGE_TAG"

      - name: push developer-cuda-sm75 image
        run: docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/developer-cuda-sm75:$IMAGE_TAG"
